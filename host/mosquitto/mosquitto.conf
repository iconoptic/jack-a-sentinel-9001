# eclipse-mosquitto 2. Global auth applies to every listener.
# 127.0.0.1 is Frigate (and later the controller) on the host network namespace.
# 10.77.0.1 is the camera AP. firewalld zone sentinel allows 1883 only there.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

allow_anonymous false
password_file /mosquitto/config/passwords
acl_file /mosquitto/config/acl

listener 1883 127.0.0.1
listener 1883 10.77.0.1

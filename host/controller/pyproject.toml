[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel-controller"
version = "0.1.0"
description = "Cross-camera Frigate review trigger and evidence export for Sentinel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "paho-mqtt>=2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "respx>=0.21",
]

[project.scripts]
sentinel-controller = "sentinel_controller.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_controller"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

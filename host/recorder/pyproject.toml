[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel-recorder"
version = "0.1.0"
description = "Simple motion recorder for Sentinel cameras"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "Pillow>=10",
  "tzdata",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
sentinel-recorder = "sentinel_recorder.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_recorder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

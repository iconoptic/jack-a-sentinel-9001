[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel-provision"
version = "0.1.0"
description = "BLE Wi-Fi provisioning and host-side bind for Sentinel cameras"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
sentinel-provision = "sentinel_provision.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["sentinel_provision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
